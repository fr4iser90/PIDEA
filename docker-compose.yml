services:
  pidea-db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: fr4iser/pidea:db
    container_name: pidea-db
    # Host port 5452 optional (psql from machine); containers use 5432 via service name
    ports:
      - "5452:5432"
    volumes:
      - pidea-db-data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  pidea-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fr4iser/pidea:backend
    container_name: pidea-backend
    ports:
      - "3000:3000"
    depends_on:
      pidea-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - pidea-backend_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp # Host /tmp for IDE integrations
    restart: unless-stopped

  pidea-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        DOMAIN: ${DOMAIN:-}
    image: fr4iser/pidea:frontend
    container_name: pidea-frontend
    ports:
      - "80:80"
    depends_on:
      - pidea-backend
    env_file:
      - .env
    volumes:
      - pidea-frontend_logs:/var/log/nginx
    restart: unless-stopped

volumes:
  pidea-db-data:
    driver: local
  pidea-backend_logs:
    driver: local
  pidea-frontend_logs:
    driver: local
